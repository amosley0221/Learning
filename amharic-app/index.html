<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="color-scheme" content="light only">
<title>አማርኛ · Learn Amharic</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Amharic">
<meta name="theme-color" content="#1B2E1F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;1,400;1,500&family=Manrope:wght@400;500;600&family=Noto+Sans+Ethiopic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light only;
  --cream: #F4EDD8;
  --paper: #FBF5E9;
  --green: #1B2E1F;
  --greenL: #2D4A2F;
  --red: #BC4B23;
  --gold: #C9A227;
}
*, *::before, *::after { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: var(--cream) !important;
  color: var(--green) !important;
  min-height: 100vh; min-height: 100dvh;
  font-family: Manrope, -apple-system, BlinkMacSystemFont, sans-serif;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
  font-size: 15px; line-height: 1.5;
}
@media (prefers-color-scheme: dark) {
  html, body { background: var(--cream) !important; color: var(--green) !important; }
}
button { font: inherit; cursor: pointer; -webkit-appearance: none; appearance: none; background: none; border: none; padding: 0; color: inherit; }
.fe { font-family: "Noto Sans Ethiopic", "Abyssinica SIL", "Nyala", serif; }
.ff { font-family: Fraunces, "Cormorant Garamond", Georgia, serif; font-style: italic; }
.icon { display: inline-block; vertical-align: middle; flex-shrink: 0; }

/* Header */
.hdr { background: var(--paper); border-bottom: 1px solid rgba(45,74,47,.15); padding: 1.5rem 1rem; }
.hdr-inner { max-width: 56rem; margin: 0 auto; display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: .5rem; }
.hdr-pre { font-size: 10px; letter-spacing: .3em; text-transform: uppercase; color: var(--red); margin-bottom: .25rem; display: flex; align-items: center; gap: .5rem; }
.hdr-title { font-family: Fraunces, serif; font-style: italic; font-weight: 400; font-size: 2.5rem; line-height: 1; margin: 0; color: var(--green); }
.hdr-title .name { font-style: normal; }
.hdr-sub { font-family: Fraunces, serif; font-style: italic; font-size: 12px; color: rgba(45,74,47,.6); max-width: 14rem; }

/* Nav */
.nav { position: sticky; top: 0; z-index: 10; background: rgba(251,245,233,.95); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-bottom: 1px solid rgba(45,74,47,.15); }
.nav-inner { max-width: 56rem; margin: 0 auto; display: flex; overflow-x: auto; padding: 0 1rem; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.nav-inner::-webkit-scrollbar { display: none; }
.tab { display: flex; align-items: center; gap: .5rem; padding: .75rem 1rem; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; white-space: nowrap; color: rgba(45,74,47,.5); border-bottom: 2px solid transparent; }
.tab.active { color: var(--green); border-bottom-color: var(--red); }

/* Main */
.main { max-width: 56rem; margin: 0 auto; padding: 2rem 1rem; }

/* Audio banner */
.audio-banner { margin-bottom: 1rem; padding: .75rem; background: rgba(201,162,39,.15); border-left: 2px solid var(--gold); font-size: 12px; line-height: 1.5; color: var(--greenL); }
.audio-banner strong { font-weight: 600; }

/* Filter pills */
.pills { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: 1.5rem; }
.pill { padding: .375rem .75rem; font-size: 11px; letter-spacing: .15em; text-transform: uppercase; border: 1px solid rgba(45,74,47,.25); color: var(--greenL); background: transparent; }
.pill.active { background: var(--green); color: var(--paper); border-color: var(--green); }

/* Grids */
.grid-2 { display: grid; grid-template-columns: 1fr; gap: 1rem; }
@media (min-width: 640px) { .grid-2 { grid-template-columns: 1fr 1fr; } }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }
@media (min-width: 640px) { .grid-3 { grid-template-columns: 1fr 1fr 1fr; } }

/* Phrase card */
.card { background: var(--paper); border: 1px solid rgba(45,74,47,.15); padding: 1.25rem; position: relative; }
.card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: .75rem; }
.cat { font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--red); font-weight: 500; }
.speak { color: rgba(45,74,47,.5); padding: .25rem; }
.speak:active { color: var(--red); }
.big-am { font-size: 1.875rem; color: var(--green); margin-bottom: .5rem; line-height: 1.2; }
.tr { font-size: 13px; color: rgba(45,74,47,.7); margin-bottom: .75rem; }
.en { font-size: 15px; color: var(--greenL); }
.en.dim { color: rgba(45,74,47,.4); }

/* Number card */
.num-card { background: var(--paper); border: 1px solid rgba(45,74,47,.15); padding: 1.25rem; position: relative; overflow: hidden; }
.num-bg { position: absolute; top: -.5rem; right: -.25rem; font-size: 4.5rem; font-family: Fraunces, serif; font-style: italic; font-weight: 300; color: rgba(201,162,39,.18); user-select: none; pointer-events: none; line-height: 1; }
.num-content { position: relative; }
.num-am { font-size: 1.875rem; color: var(--green); margin-bottom: .25rem; }
.num-tr { font-size: 12px; color: rgba(45,74,47,.7); }
.num-n { font-size: 11px; letter-spacing: .15em; text-transform: uppercase; color: var(--red); font-weight: 500; margin-top: .5rem; }

/* Fidel */
.fidel-intro { margin-bottom: 1.5rem; padding: 1rem; background: var(--green); color: var(--paper); }
.fidel-intro-pre { font-size: 10px; letter-spacing: .25em; text-transform: uppercase; color: var(--gold); margin-bottom: .5rem; }
.fidel-intro-body { font-size: 13px; line-height: 1.5; }
.fidel-intro-body em { color: var(--gold); font-style: normal; }
.fidel-orders { display: flex; gap: .75rem; margin-top: .75rem; font-size: 12px; }
.fidel-order { text-align: center; }
.fidel-order-num { color: var(--gold); font-weight: 500; }
.fidel-order-vowel { font-family: Fraunces, serif; font-style: italic; }
.fidel-scroll { overflow-x: auto; margin: 0 -1rem; padding: 0 1rem; -webkit-overflow-scrolling: touch; }
.fidel-table { display: grid; grid-template-columns: auto repeat(7, minmax(2.5rem, 1fr)); gap: 1px; background: rgba(45,74,47,.15); min-width: 100%; width: max-content; }
.fidel-h { background: var(--paper); padding: .5rem; text-align: center; font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--red); font-family: Fraunces, serif; font-style: italic; }
.fidel-rname { background: var(--paper); padding: .5rem; display: flex; align-items: center; justify-content: center; font-size: 12px; color: rgba(45,74,47,.7); font-family: Fraunces, serif; font-style: italic; min-width: 2.5rem; }
.fidel-char { background: var(--paper); padding: .75rem; text-align: center; font-size: 1.25rem; color: var(--green); font-family: "Noto Sans Ethiopic", "Abyssinica SIL", serif; min-width: 2.5rem; }
.fidel-char.sel { background: var(--red); color: var(--paper); }

/* Verbs */
.note-box { margin-bottom: 1.25rem; padding: 1rem; background: rgba(27,46,31,.05); border-left: 2px solid var(--red); }
.note-box .h { font-size: 10px; letter-spacing: .25em; text-transform: uppercase; color: var(--red); font-weight: 500; margin-bottom: .25rem; }
.note-box p { margin: 0; font-size: 13px; line-height: 1.5; color: var(--greenL); }
.note-box em { font-family: Fraunces, serif; font-style: italic; }
.note-box .fe { font-family: "Noto Sans Ethiopic", serif; font-style: normal; }
.verb { background: var(--paper); border: 1px solid rgba(45,74,47,.15); margin-bottom: .75rem; }
.verb-head { padding: 1rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; cursor: pointer; }
.verb-head-left { display: flex; align-items: baseline; gap: .75rem; flex-wrap: wrap; }
.verb-am { font-family: "Noto Sans Ethiopic", serif; font-size: 1.5rem; color: var(--green); }
.verb-tr { font-family: Fraunces, serif; font-style: italic; font-size: 13px; color: rgba(45,74,47,.7); }
.verb-en { font-size: 13px; color: var(--greenL); }
.verb-body { border-top: 1px solid rgba(45,74,47,.1); background: rgba(244,237,216,.4); padding: 1rem; }
.verb-note { font-family: Fraunces, serif; font-style: italic; font-size: 12px; color: rgba(45,74,47,.7); margin-bottom: 1rem; }
.tense-head { font-size: 10px; letter-spacing: .25em; text-transform: uppercase; color: var(--red); font-weight: 500; margin-bottom: .5rem; }
.conj-grid { display: grid; grid-template-columns: 1fr; gap: .5rem; margin-bottom: 1rem; }
@media (min-width: 640px) { .conj-grid { grid-template-columns: 1fr 1fr; } }
.conj-row { display: flex; align-items: baseline; justify-content: space-between; padding: .5rem; border-bottom: 1px solid rgba(45,74,47,.1); }
.conj-person { font-size: 12px; color: rgba(45,74,47,.6); flex-shrink: 0; width: 6rem; }
.conj-am { font-family: "Noto Sans Ethiopic", serif; font-size: 1.125rem; color: var(--green); flex: 1; margin: 0 .5rem; }
.conj-tr { font-family: Fraunces, serif; font-style: italic; font-size: 11px; color: rgba(45,74,47,.5); }

/* Dialogue */
.dlg-tabs { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: 1.25rem; }
.dlg { background: var(--paper); border: 1px solid rgba(45,74,47,.15); }
.dlg-head { padding: 1.25rem; border-bottom: 1px solid rgba(45,74,47,.1); display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; }
.dlg-title { font-family: Fraunces, serif; font-style: italic; font-size: 1.5rem; color: var(--green); margin: 0 0 .25rem 0; }
.dlg-scene { font-size: 13px; color: rgba(45,74,47,.7); margin: 0; }
.dlg-toggle { flex-shrink: 0; font-size: 10px; letter-spacing: .15em; text-transform: uppercase; padding: .375rem .75rem; border: 1px solid rgba(45,74,47,.25); color: var(--greenL); }
.dlg-body { padding: 1.25rem; display: flex; flex-direction: column; gap: 1rem; }
.dlg-row { display: flex; gap: .75rem; }
.dlg-row.r { flex-direction: row-reverse; }
.dlg-avatar { flex-shrink: 0; width: 2.25rem; height: 2.25rem; border-radius: 50%; background: var(--green); color: var(--paper); display: flex; align-items: center; justify-content: center; font-size: 10px; text-transform: uppercase; letter-spacing: .1em; font-weight: 500; }
.dlg-row.r .dlg-avatar { background: var(--red); }
.dlg-bubble { flex: 1; max-width: 85%; }
.dlg-row.r .dlg-bubble { text-align: right; }
.dlg-msg { display: inline-block; padding: .75rem; background: rgba(244,237,216,.6); text-align: left; }
.dlg-row.r .dlg-msg { background: rgba(188,75,35,.08); }
.dlg-am-line { display: flex; align-items: baseline; gap: .5rem; }
.dlg-am-text { font-family: "Noto Sans Ethiopic", serif; font-size: 1.25rem; color: var(--green); }
.dlg-tr { font-family: Fraunces, serif; font-style: italic; font-size: 12px; color: rgba(45,74,47,.65); margin-top: .25rem; }
.dlg-en { font-size: 13px; color: var(--greenL); margin-top: .25rem; }

/* Calendar */
.cal-hero { background: var(--green); color: var(--paper); padding: 1.5rem; margin-bottom: 1.5rem; position: relative; overflow: hidden; }
.cal-hero::before, .cal-hero::after { content: ''; position: absolute; border-radius: 50%; }
.cal-hero::before { top: -3rem; right: -3rem; width: 8rem; height: 8rem; background: rgba(201,162,39,.1); }
.cal-hero::after { bottom: -2rem; left: -2rem; width: 6rem; height: 6rem; background: rgba(188,75,35,.15); }
.cal-hero-content { position: relative; z-index: 1; }
.cal-pre { font-size: 10px; letter-spacing: .3em; text-transform: uppercase; color: var(--gold); margin-bottom: .5rem; }
.cal-date { font-family: "Noto Sans Ethiopic", serif; font-size: 3rem; margin: .25rem 0; line-height: 1.1; }
.cal-date-tr { font-family: Fraunces, serif; font-style: italic; font-size: 1.125rem; color: rgba(201,162,39,.9); margin-bottom: 1rem; }
.cal-grid { display: flex; flex-wrap: wrap; gap: 1rem; font-size: 13px; }
.cal-label { font-size: 10px; letter-spacing: .05em; text-transform: uppercase; color: rgba(201,162,39,.7); margin-bottom: .25rem; }
.cal-val { font-family: "Noto Sans Ethiopic", serif; font-size: 15px; }
.cal-val-en { font-size: 15px; }
.cal-val-sub { font-family: Fraunces, serif; font-style: italic; font-size: 11px; color: rgba(251,245,233,.7); }
.cal-note { background: var(--paper); border: 1px solid rgba(45,74,47,.15); padding: 1rem; margin-bottom: 1.5rem; }
.cal-note-head { font-size: 10px; letter-spacing: .25em; text-transform: uppercase; color: var(--red); font-weight: 500; margin-bottom: .5rem; }
.cal-note p { margin: 0; font-size: 13px; line-height: 1.5; }
.cal-note em { font-family: Fraunces, serif; }
.cal-note .fe { font-family: "Noto Sans Ethiopic", serif; }
.section-head { font-size: 10px; letter-spacing: .25em; text-transform: uppercase; color: var(--red); font-weight: 500; margin: 1.5rem 0 .75rem 0; }
.month-grid { display: grid; grid-template-columns: 1fr; gap: .5rem; }
@media (min-width: 640px) { .month-grid { grid-template-columns: 1fr 1fr; } }
.month-row { padding: .75rem; display: flex; justify-content: space-between; align-items: center; background: var(--paper); border: 1px solid rgba(45,74,47,.15); }
.month-row.current { background: rgba(188,75,35,.1); border-color: var(--red); }
.month-row-inner { display: flex; align-items: baseline; gap: .5rem; }
.month-row-num { font-size: 12px; color: rgba(45,74,47,.5); width: 1rem; }
.month-row-am { font-family: "Noto Sans Ethiopic", serif; font-size: 1.25rem; color: var(--green); }
.month-row-tr { font-family: Fraunces, serif; font-style: italic; font-size: 13px; color: rgba(45,74,47,.7); }
.month-row-greg { font-size: 11px; color: rgba(45,74,47,.6); margin-left: 1.5rem; margin-top: .125rem; }
.month-row-now { font-size: 9px; letter-spacing: .2em; text-transform: uppercase; color: var(--red); font-weight: 700; }
.day-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; }
@media (min-width: 640px) { .day-grid { grid-template-columns: 1fr 1fr 1fr 1fr; } }
.day-card { padding: .75rem; text-align: center; background: var(--paper); border: 1px solid rgba(45,74,47,.15); color: var(--green); }
.day-card.current { background: var(--green); color: var(--paper); border-color: var(--green); }
.day-am { font-family: "Noto Sans Ethiopic", serif; font-size: 1.125rem; }
.day-tr { font-family: Fraunces, serif; font-style: italic; font-size: 12px; color: rgba(45,74,47,.6); }
.day-card.current .day-tr { color: var(--gold); }
.day-en { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: rgba(45,74,47,.5); }
.day-card.current .day-en { color: rgba(251,245,233,.6); }

/* Quiz */
.quiz-top { display: flex; justify-content: space-between; align-items: center; padding-bottom: 1rem; margin-bottom: 1.5rem; border-bottom: 1px solid rgba(45,74,47,.15); }
.quiz-score-pre { font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--red); margin-bottom: .25rem; }
.quiz-score { display: flex; align-items: baseline; gap: .75rem; }
.quiz-score-num { font-family: Fraunces, serif; font-style: italic; font-size: 1.5rem; color: var(--green); }
.quiz-score-frac { color: rgba(45,74,47,.4); }
.quiz-acc { font-size: 12px; color: rgba(45,74,47,.6); }
.quiz-toggle { padding: .5rem .75rem; font-size: 11px; letter-spacing: .15em; text-transform: uppercase; border: 1px solid rgba(45,74,47,.25); display: flex; align-items: center; gap: .5rem; color: var(--greenL); }
.quiz-prompt { background: var(--green); padding: 2rem; text-align: center; margin-bottom: 1rem; }
.quiz-prompt-pre { font-size: 10px; letter-spacing: .25em; text-transform: uppercase; color: var(--gold); margin-bottom: 1rem; }
.quiz-prompt-text { color: var(--paper); margin-bottom: .5rem; line-height: 1.2; }
.quiz-prompt-text.am-mode { font-family: "Noto Sans Ethiopic", serif; font-size: 2.25rem; }
.quiz-prompt-text.en-mode { font-family: Fraunces, serif; font-style: italic; font-size: 1.5rem; }
.quiz-speak { color: rgba(201,162,39,.8); margin-top: .25rem; }
.quiz-opts { display: flex; flex-direction: column; gap: .5rem; margin-bottom: 1rem; }
.quiz-opt { text-align: left; padding: 1rem; border: 1px solid rgba(45,74,47,.2); background: var(--paper); color: var(--green); display: flex; justify-content: space-between; align-items: center; width: 100%; }
.quiz-opt.am-mode .quiz-opt-txt { font-family: "Noto Sans Ethiopic", serif; font-size: 1.5rem; }
.quiz-opt.en-mode .quiz-opt-txt { font-family: Fraunces, serif; font-style: italic; font-size: 15px; }
.quiz-opt.correct { background: var(--green); border-color: var(--green); color: var(--paper); }
.quiz-opt.wrong { background: rgba(188,75,35,.1); border-color: var(--red); color: var(--red); }
.quiz-opt.dim { color: rgba(45,74,47,.4); border-color: rgba(45,74,47,.1); }
.quiz-opt[disabled] { cursor: default; }
.quiz-next { width: 100%; padding: 1rem; background: var(--red); color: var(--paper); text-transform: uppercase; letter-spacing: .2em; font-size: 11px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: .5rem; }

/* Flashcards */
.flash-top { display: flex; justify-content: space-between; align-items: center; padding-bottom: .75rem; margin-bottom: 1.25rem; border-bottom: 1px solid rgba(45,74,47,.15); }
.flash-stats { display: flex; gap: 1.25rem; }
.flash-stat-label { font-size: 9px; letter-spacing: .2em; text-transform: uppercase; color: var(--red); margin-bottom: .125rem; }
.flash-stat-val { font-weight: 500; color: var(--green); font-size: 13px; }
.flash-reset { font-size: 10px; letter-spacing: .15em; text-transform: uppercase; color: rgba(45,74,47,.5); display: flex; align-items: center; gap: .25rem; }
.flash-card { background: var(--paper); border: 1px solid rgba(45,74,47,.15); padding: 2.5rem; margin-bottom: 1rem; text-align: center; min-height: 14rem; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; cursor: pointer; }
.flash-card-new { position: absolute; top: .75rem; left: .75rem; font-size: 9px; letter-spacing: .25em; text-transform: uppercase; color: var(--gold); font-weight: 500; }
.flash-card-kind { position: absolute; top: .75rem; right: .75rem; font-size: 9px; letter-spacing: .25em; text-transform: uppercase; color: rgba(45,74,47,.4); }
.flash-card-am { font-family: "Noto Sans Ethiopic", serif; font-size: 3rem; color: var(--green); margin-bottom: .75rem; line-height: 1.1; }
.flash-card-tr { font-family: Fraunces, serif; font-style: italic; font-size: 14px; color: rgba(45,74,47,.7); margin-bottom: .5rem; }
.flash-card-en { font-size: 1.125rem; color: var(--greenL); }
.flash-card-hint { font-size: 11px; letter-spacing: .25em; text-transform: uppercase; color: rgba(45,74,47,.4); margin-top: .75rem; }
.flash-card-speak { position: absolute; bottom: .75rem; right: .75rem; color: rgba(45,74,47,.5); padding: .25rem; }
.flash-rate-grid { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: .5rem; }
.flash-rate { padding: .75rem; display: flex; flex-direction: column; align-items: center; border: 1px solid transparent; }
.flash-rate-label { font-size: 11px; letter-spacing: .15em; font-weight: 500; text-transform: uppercase; }
.flash-rate-sub { font-size: 9px; opacity: .7; margin-top: .125rem; }
.flash-rate.again { background: var(--red); color: var(--paper); border-color: var(--red); }
.flash-rate.hard { background: var(--paper); color: var(--red); border-color: rgba(188,75,35,.5); }
.flash-rate.good { background: var(--paper); color: var(--green); border-color: rgba(45,74,47,.4); }
.flash-rate.easy { background: var(--green); color: var(--paper); border-color: var(--green); }
.flash-show { width: 100%; padding: 1rem; background: var(--green); color: var(--paper); text-transform: uppercase; letter-spacing: .2em; font-size: 11px; font-weight: 500; }
.flash-done { text-align: center; padding: 3rem 1rem; background: var(--paper); border: 1px solid rgba(45,74,47,.15); }
.flash-done-icon { color: var(--gold); margin-bottom: 1rem; display: flex; justify-content: center; }
.flash-done-title { font-family: Fraunces, serif; font-style: italic; font-size: 1.875rem; color: var(--green); margin: 0 0 .5rem 0; }
.flash-done-msg { font-size: 13px; color: rgba(45,74,47,.7); margin-bottom: .25rem; }
.flash-done-stats { font-size: 12px; color: rgba(45,74,47,.5); margin-bottom: 1.5rem; }

/* Footer */
.ftr { border-top: 1px solid rgba(45,74,47,.15); padding: 1.5rem; text-align: center; margin-top: 3rem; }
.ftr-text { font-size: 10px; letter-spacing: .3em; text-transform: uppercase; color: rgba(45,74,47,.5); }

/* Home splash */
.home { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; text-align: center; cursor: pointer; background: var(--cream); position: relative; }

.home-en { font-family: Fraunces, serif; font-style: italic; font-weight: 400; font-size: 2.75rem; line-height: 1.1; color: var(--green); margin-bottom: 1.75rem; max-width: 22rem; }

.home-tr { font-family: Fraunces, serif; font-style: italic; font-size: 1rem; color: rgba(45,74,47,.65); margin-bottom: 3.5rem; }
.home-hint { font-size: 10px; letter-spacing: .3em; text-transform: uppercase; color: rgba(45,74,47,.45); display: flex; align-items: center; gap: .5rem; }
.home > * { opacity: 0; animation: fadeUp .7s ease-out forwards; }
.home > *:nth-child(1) { animation-delay: .1s; }
.home > *:nth-child(2) { animation-delay: .3s; }
.home > *:nth-child(3) { animation-delay: .5s; }

.home > *:nth-child(6) { animation-delay: 1.2s; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

function periodFor(h) {
  if (h >= 6 && h < 12) return { am: 'ጥዋት', tr: "t'wat", en: 'morning' };
  if (h >= 12 && h < 18) return { am: 'ቀን', tr: 'qen', en: 'afternoon' };
  if (h >= 18 && h < 21) return { am: 'ምሽት', tr: 'mishit', en: 'evening' };
  return { am: 'ሌሊት', tr: 'lelit', en: 'night' };
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
  });
}

var _voices = [];
function refreshVoices() {
  try { _voices = window.speechSynthesis.getVoices() || []; } catch (e) {}
}
function findAmVoice() {
  if (!_voices.length) refreshVoices();
  for (var i = 0; i < _voices.length; i++) {
    if (/^am/i.test(_voices[i].lang)) return _voices[i];
  }
  return null;
}
function speak(am, tr) {
  if (typeof window === 'undefined' || !window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  if (!_voices.length) refreshVoices();
  var v = findAmVoice();
  var u = new SpeechSynthesisUtterance();
  if (v) {
    u.text = am;
    u.voice = v;
    u.lang = v.lang;
    u.rate = 0.85;
  } else if (tr) {
    u.text = tr.replace(/[?!.,]/g, '');
    u.rate = 0.7;
  } else {
    u.text = am;
    u.rate = 0.7;
  }
  try { window.speechSynthesis.speak(u); } catch (e) {}
}
if (window.speechSynthesis) {
  refreshVoices();
  try { window.speechSynthesis.onvoiceschanged = refreshVoices; } catch (e) {}
}

function gregorianToJDN(y, m, d) {
  var a = Math.floor((14 - m) / 12);
  var yy = y + 4800 - a;
  var mm = m + 12 * a - 3;
  return d + Math.floor((153 * mm + 2) / 5) + 365 * yy +
    Math.floor(yy / 4) - Math.floor(yy / 100) + Math.floor(yy / 400) - 32045;
}
function jdnToEthiopian(jdn) {
  var r = ((jdn - 1723856) % 1461 + 1461) % 1461;
  var n = (r % 365) + 365 * Math.floor(r / 1460);
  var year = 4 * Math.floor((jdn - 1723856) / 1461) + Math.floor(r / 365) - Math.floor(r / 1460);
  var month = Math.floor(n / 30) + 1;
  var day = (n % 30) + 1;
  return { year: year, month: month, day: day };
}
function gregToEthDate(date) {
  return jdnToEthiopian(gregorianToJDN(date.getFullYear(), date.getMonth() + 1, date.getDate()));
}
function gregToEthTime(date) {
  var h = date.getHours();
  var ethH = (h - 6 + 24) % 12;
  if (ethH === 0) ethH = 12;
  return { hour: ethH, minute: date.getMinutes(), period: periodFor(h) };
}

function srRate(card, q) {
  var now = Date.now();
  var ease = (card && card.ease) || 2.5;
  var interval = (card && card.interval) || 0;
  var reps = (card && card.reps) || 0;
  if (q === 1) return { ease: Math.max(1.3, ease - 0.2), interval: 0, reps: 0, due: now + 10 * 60 * 1000 };
  reps += 1;
  var ni;
  if (reps === 1) ni = 1;
  else if (reps === 2) ni = 6;
  else ni = Math.max(1, Math.round(interval * ease));
  if (q === 2) { ni = Math.max(1, Math.round(ni * 0.8)); ease = Math.max(1.3, ease - 0.15); }
  else if (q === 4) { ni = Math.round(ni * 1.3); ease += 0.15; }
  return { ease: ease, interval: ni, reps: reps, due: now + ni * 24 * 60 * 60 * 1000 };
}

    cards.push({ id: 'v:' + k, am: VERBS[k].am, tr: VERBS[k].tr, en: VERBS[k].en, kind: 'verb' });
  }
  return cards;
}

function genQuestion() {
  var correct = QUIZ_POOL[Math.floor(Math.random() * QUIZ_POOL.length)];
  var wrongs = [];
  while (wrongs.length < 3) {
    var c = QUIZ_POOL[Math.floor(Math.random() * QUIZ_POOL.length)];
    var found = false;
    for (var i = 0; i < wrongs.length; i++) if (wrongs[i].en === c.en) { found = true; break; }
    if (c.en !== correct.en && !found) wrongs.push(c);
  }
  var opts = [correct].concat(wrongs);
  for (var s = opts.length - 1; s > 0; s--) {
    var swap = Math.floor(Math.random() * (s + 1));
    var tmp = opts[s]; opts[s] = opts[swap]; opts[swap] = tmp;
  }
  return { correct: correct, options: opts };
}

function nextFlashCard() {
  var now = Date.now();
  var newOnes = [], reviewOnes = [];
  for (var i = 0; i < POOL.length; i++) {
    var c = POOL[i];
    var st = state.flash.progress[c.id];
    if (!st) newOnes.push(c);
    else if (st.due <= now) reviewOnes.push({ card: c, due: st.due });
  }
  reviewOnes.sort(function(a, b) { return a.due - b.due; });
  if (newOnes.length > 0) return newOnes[0];
  if (reviewOnes.length > 0) return reviewOnes[0].card;
  return null;
}
function dueCount() {
  var now = Date.now();
  var count = 0;
  for (var i = 0; i < POOL.length; i++) {
    var c = POOL[i];
    var st = state.flash.progress[c.id];
    if (!st || st.due <= now) count++;
  }
  return count;
}

    '<div class="cal-grid">' +
      '<div><div class="cal-label">Day</div><div class="cal-val">' + dayName.am + '</div><div class="cal-val-sub">' + esc(dayName.tr) + ' · ' + esc(dayName.en) + '</div></div>' +
      '<div><div class="cal-label">Time (Ethiopian)</div><div class="cal-val">' + time.hour + ':' + (time.minute < 10 ? '0' : '') + time.minute + ' ' + time.period.am + '</div><div class="cal-val-sub">' + esc(time.period.tr) + ' · ' + esc(time.period.en) + '</div></div>' +
      '<div><div class="cal-label">Your time</div><div class="cal-val-en">' + now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) + '</div><div class="cal-val-sub">' + now.toLocaleDateString([], { month: 'short', day: 'numeric', year: 'numeric' }) + '</div></div>' +
    '</div>' +
  '</div></div>';
  html += '<div class="cal-note">' +
    '<div class="cal-note-head">How Ethiopian time works</div>' +
    '<p>The day begins at dawn — what\'s <em>6 AM</em> for you is <span class="fe">12 ሰዓት ጥዋት</span> in Ethiopia. So "3 in the morning" in Amharic means roughly 9 AM. Period words narrow the meaning: <span class="fe">ጥዋት</span> (morning), <span class="fe">ቀን</span> (afternoon), <span class="fe">ምሽት</span> (evening), <span class="fe">ሌሊት</span> (night).</p>' +
  '</div>';
  html += '<div class="section-head">13 Months of the Ge\'ez Calendar</div><div class="month-grid">';
  for (var i = 0; i < ETH_MONTHS.length; i++) {
    var m = ETH_MONTHS[i];
    var isCurrent = (i + 1) === eth.month;
    html += '<div class="month-row ' + (isCurrent ? 'current' : '') + '">' +
      '<div>' +
        '<div class="month-row-inner">' +
          '<span class="month-row-num">' + (i + 1) + '.</span>' +
          '<span class="month-row-am">' + m.am + '</span>' +
          '<span class="month-row-tr">' + esc(m.tr) + '</span>' +
        '</div>' +
        '<div class="month-row-greg">' + esc(m.greg) + '</div>' +
      '</div>' +
      (isCurrent ? '<span class="month-row-now">now</span>' : '') +
    '</div>';
  }
  html += '</div>';
  html += '<div class="section-head">Days of the Week</div><div class="day-grid">';
  var dayOrder = [1, 2, 3, 4, 5, 6, 0];
  for (var dd = 0; dd < dayOrder.length; dd++) {
    var di = dayOrder[dd];
    var d = ETH_DAYS[di];
    var isCur = now.getDay() === di;
    html += '<div class="day-card ' + (isCur ? 'current' : '') + '">' +
      '<div class="day-am">' + d.am + '</div>' +
      '<div class="day-tr">' + esc(d.tr) + '</div>' +
      '<div class="day-en">' + esc(d.en) + '</div>' +
    '</div>';
  }
  html += '</div>';
  return html;
}

function renderQuiz() {
  if (!state.quiz.q) state.quiz.q = genQuestion();
  var q = state.quiz.q;
  var mode = state.quiz.mode;
  var total = state.quiz.score.right + state.quiz.score.wrong;
  var acc = total > 0 ? Math.round((state.quiz.score.right / total) * 100) : 0;
  var html = audioBanner();
  html += '<div class="quiz-top">' +
    '<div>' +
      '<div class="quiz-score-pre">Score</div>' +
      '<div class="quiz-score">' +
        '<span class="quiz-score-num">' + state.quiz.score.right + '<span class="quiz-score-frac">/' + total + '</span></span>' +
        '<span class="quiz-acc">' + acc + '% accuracy</span>' +
      '</div>' +
    '</div>' +
    '<button class="quiz-toggle" data-act="quiz-mode">' + svg(P.shuf, 12) + (mode === 'am-to-en' ? 'AM → EN' : 'EN → AM') + '</button>' +
  '</div>';
  html += '<div class="quiz-prompt">' +
    '<div class="quiz-prompt-pre">' + (mode === 'am-to-en' ? 'What does this mean?' : 'Translate to Amharic') + '</div>' +
    '<div class="quiz-prompt-text ' + (mode === 'am-to-en' ? 'am-mode fe' : 'en-mode') + '">' +
      (mode === 'am-to-en' ? q.correct.am : esc(q.correct.en)) +
    '</div>';
  if (mode === 'am-to-en') {
    html += '<button class="quiz-speak" data-act="speak" data-am="' + esc(q.correct.am) + '" data-tr="' + esc(q.correct.tr) + '">' + svg(P.vol, 16) + '</button>';
  }
  html += '</div>';
  html += '<div class="quiz-opts">';
  for (var i = 0; i < q.options.length; i++) {
    var o = q.options[i];
    var isCorrect = o.en === q.correct.en;
    var isPicked = state.quiz.picked && state.quiz.picked.en === o.en;
    var cls = mode === 'am-to-en' ? 'en-mode' : 'am-mode fe';
    if (state.quiz.picked) {
      if (isCorrect) cls += ' correct';
      else if (isPicked) cls += ' wrong';
      else cls += ' dim';
    }
    var iconHtml = '';
    if (state.quiz.picked) {
      if (isCorrect) iconHtml = svg(P.check, 18);
      else if (isPicked) iconHtml = svg(P.x, 18);
    }
    var optText = mode === 'am-to-en' ? esc(o.en) : o.am;
    html += '<button class="quiz-opt ' + cls + '" data-act="quiz-pick" data-idx="' + i + '"' + (state.quiz.picked ? ' disabled' : '') + '>' +
      '<span class="quiz-opt-txt">' + optText + '</span>' + iconHtml +
    '</button>';
  }
  html += '</div>';
  if (state.quiz.picked) {
    html += '<button class="quiz-next" data-act="quiz-next">Next Question ' + svg(P.arrow, 14) + '</button>';
  }
  return html;
}

function renderFlash() {
  var due = dueCount();
  var current = nextFlashCard();
  state.flash.currentId = current ? current.id : null;
  var learned = Object.keys(state.flash.progress).length;
  var html = audioBanner();
  if (!current) {
    html += '<div class="flash-done">' +
      '<div class="flash-done-icon">' + svg(P.spark, 40) + '</div>' +
      '<h3 class="flash-done-title">' + (state.flash.sessionCount > 0 ? 'Session complete!' : 'All caught up') + '</h3>' +
      '<div class="flash-done-msg">' +
        (state.flash.sessionCount > 0 ? 'You reviewed ' + state.flash.sessionCount + ' card' + (state.flash.sessionCount === 1 ? '' : 's') + ' this session. ' : '') +
        'Come back when more cards are due.' +
      '</div>' +
      '<div class="flash-done-stats">' + learned + ' of ' + POOL.length + ' cards in your collection</div>' +
      '<button class="flash-reset" data-act="flash-reset">' + svg(P.refresh, 12) + ' Reset Progress</button>' +
    '</div>';
    return html;
  }
  var isNew = !state.flash.progress[current.id];
  html += '<div class="flash-top">' +
    '<div class="flash-stats">' +
      '<div><div class="flash-stat-label">Due</div><div class="flash-stat-val">' + due + '</div></div>' +
      '<div><div class="flash-stat-label">Session</div><div class="flash-stat-val">' + state.flash.sessionCount + '</div></div>' +
      '<div><div class="flash-stat-label">Learned</div><div class="flash-stat-val">' + learned + '/' + POOL.length + '</div></div>' +
    '</div>' +
    '<button class="flash-reset" data-act="flash-reset">' + svg(P.refresh, 11) + ' Reset</button>' +
  '</div>';
  html += '<div class="flash-card" data-act="flash-flip">' +
    (isNew ? '<span class="flash-card-new">New</span>' : '') +
    '<span class="flash-card-kind">' + esc(current.kind) + '</span>' +
    '<div class="flash-card-am">' + current.am + '</div>';
  if (state.flash.flipped) {
    html += '<div class="flash-card-tr">' + esc(current.tr) + '</div>' +
      '<div class="flash-card-en">' + esc(current.en) + '</div>';
  } else {
    html += '<div class="flash-card-hint">tap to reveal</div>';
  }
  html += '<button class="flash-card-speak" data-act="speak" data-am="' + esc(current.am) + '" data-tr="' + esc(current.tr) + '">' + svg(P.vol, 16) + '</button>';
  html += '</div>';
  if (state.flash.flipped) {
    html += '<div class="flash-rate-grid">' +
      '<button class="flash-rate again" data-act="flash-rate" data-q="1"><span class="flash-rate-label">Again</span><span class="flash-rate-sub">10 min</span></button>' +
      '<button class="flash-rate hard" data-act="flash-rate" data-q="2"><span class="flash-rate-label">Hard</span><span class="flash-rate-sub">short</span></button>' +
      '<button class="flash-rate good" data-act="flash-rate" data-q="3"><span class="flash-rate-label">Good</span><span class="flash-rate-sub">normal</span></button>' +
      '<button class="flash-rate easy" data-act="flash-rate" data-q="4"><span class="flash-rate-label">Easy</span><span class="flash-rate-sub">long</span></button>' +
    '</div>';
  } else {
    html += '<button class="flash-show" data-act="flash-show">Show Answer</button>';
  }
  return html;
}

function renderHome() {
  return '<div class="home" data-act="home-enter">' +
    '<div class="home-pre">' + svg(P.spark, 11) + ' Learn Amharic · አማርኛ</div>' +
    '<div class="home-en">Prince is a bum</div>' +
    '<div class="home-divider"></div>' +
    '<div class="home-am">ፕሪንስ ቦዘኔ ነው</div>' +
    '<div class="home-tr">prins bozene new</div>' +
    '<div class="home-hint">tap anywhere to begin ' + svg(P.arrow, 12) + '</div>' +
  '</div>';
}

function renderTab() {
  switch (state.tab) {
    case 'phrases': return renderPhrases();
    case 'numbers': return renderNumbers();
    case 'fidel': return renderFidel();
    case 'verbs': return renderVerbs();
    case 'dialogues': return renderDialogues();
    case 'calendar': return renderCalendar();
    case 'quiz': return renderQuiz();
    case 'flash': return renderFlash();
  }
  return '';
}

function renderApp() {
  if (state.tab === 'home') return renderHome();
  return renderHeader() + renderNav() + '<main class="main">' + renderTab() + '</main>' +
    '<footer class="ftr"><div class="ftr-text">ኢትዮጵያ · ethiopia · made with care</div></footer>';
}

function render() {
  document.getElementById('app').innerHTML = renderApp();
}

// ============ EVENTS ============
var calendarTimer = null;
function startCalTimer() {
  if (calendarTimer) clearInterval(calendarTimer);
  calendarTimer = setInterval(function() {
    if (state.tab === 'calendar') {
      state.calendar.now = new Date();
      render();
    } else {
      clearInterval(calendarTimer);
      calendarTimer = null;
    }
  }, 30000);
}

document.addEventListener('click', function(e) {
  var btn = e.target.closest && e.target.closest('[data-act]');
  if (!btn) return;
  var act = btn.dataset.act;

  if (act === 'speak') {
    e.preventDefault(); e.stopPropagation();
    speak(btn.dataset.am, btn.dataset.tr);
    return;
  }

  switch (act) {
    case 'home-enter':
      state.tab = 'phrases';
      render();
      window.scrollTo(0, 0);
      break;
    case 'tab':
      state.tab = btn.dataset.val;
      if (state.tab === 'calendar') {
        state.calendar.now = new Date();
        startCalTimer();
      }
      if (state.tab === 'quiz' && !state.quiz.q) {
        state.quiz.q = genQuestion();
      }
      render();
      window.scrollTo(0, 0);
      break;
    case 'phrase-filter':
      state.phrases.filter = btn.dataset.val;
      render();
      break;
    case 'phrase-flip':
      var idx = btn.dataset.idx;
      state.phrases.flipped[idx] = !state.phrases.flipped[idx];
      render();
      break;
    case 'fidel-cell':
      // direct DOM update for performance
      var prev = document.querySelector('.fidel-char.sel');
      if (prev) prev.classList.remove('sel');
      btn.classList.add('sel');
      state.fidel.selected = btn.dataset.key;
      speak(btn.dataset.ch, btn.dataset.tr);
      break;
    case 'verb-toggle':
      var vidx = parseInt(btn.dataset.idx, 10);
      state.verbs.openIdx = state.verbs.openIdx === vidx ? -1 : vidx;
      render();
      break;
    case 'dlg-tab':
      state.dialogues.idx = parseInt(btn.dataset.idx, 10);
      render();
      break;
    case 'dlg-toggle-en':
      state.dialogues.showEn = !state.dialogues.showEn;
      render();
      break;
    case 'quiz-mode':
      state.quiz.mode = state.quiz.mode === 'am-to-en' ? 'en-to-am' : 'am-to-en';
      state.quiz.picked = null;
      state.quiz.q = genQuestion();
      render();
      break;
    case 'quiz-pick':
      if (state.quiz.picked) return;
      var qidx = parseInt(btn.dataset.idx, 10);
      var picked = state.quiz.q.options[qidx];
      state.quiz.picked = picked;
      if (picked.en === state.quiz.q.correct.en) state.quiz.score.right++;
      else state.quiz.score.wrong++;
      render();
      break;
    case 'quiz-next':
      state.quiz.picked = null;
      state.quiz.q = genQuestion();
      state.quiz.round++;
      render();
      break;
    case 'flash-flip':
    case 'flash-show':
      state.flash.flipped = !state.flash.flipped;
      render();
      break;
    case 'flash-rate':
      var q = parseInt(btn.dataset.q, 10);
      var cid = state.flash.currentId;
      if (!cid) return;
      var newSt = srRate(state.flash.progress[cid], q);
      state.flash.progress[cid] = newSt;
      saveSR();
      state.flash.flipped = false;
      state.flash.sessionCount++;
      render();
      break;
    case 'flash-reset':
      if (confirm('Reset all flashcard progress? This cannot be undone.')) {
        state.flash.progress = {};
        state.flash.sessionCount = 0;
        try { localStorage.removeItem('amharic-sr'); } catch (e) {}
        render();
      }
      break;
  }
});

// ============ INIT ============
function checkAudio() {
  refreshVoices();
  state.audioOk = !!findAmVoice();
}
checkAudio();
if (window.speechSynthesis) {
  try {
    window.speechSynthesis.onvoiceschanged = function() {
      refreshVoices();
      var was = state.audioOk;
      state.audioOk = !!findAmVoice();
      if (was !== state.audioOk) render();
    };
  } catch (e) {}
}
// Re-check after a delay (iOS often loads voices late)
setTimeout(function() {
  refreshVoices();
  var was = state.audioOk;
  state.audioOk = !!findAmVoice();
  if (was !== state.audioOk) render();
}, 800);

render();

})();
</script>

if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
}
